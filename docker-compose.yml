services:
  spark-master:
    container_name: spark-master
    image: apache/spark:3.5.3-python3
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
      - "4040:4040"
    volumes:
      - ./scripts:/opt/spark/scripts
      - ./data:/opt/spark/data
      - ./spark-events:/opt/spark/spark-events
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    environment:
      - SPARK_CONF_DIR=/opt/spark/conf

  spark-worker-1:
    container_name: spark-worker-1
    image: apache/spark:3.5.3-python3
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
      - SPARK_CONF_DIR=/opt/spark/conf
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=python3
    ports:
      - "8081:8081"
    volumes:
      - ./scripts:/opt/spark/scripts
      - ./data:/opt/spark/data
      - ./spark-events:/opt/spark/spark-events
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf

  spark-history:
    container_name: spark-history
    image: apache/spark:3.5.3-python3
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.history.HistoryServer
    ports:
      - "18080:18080"
    volumes:
      - ./spark-events:/opt/spark/spark-events
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    environment:
      - SPARK_CONF_DIR=/opt/spark/conf
      - SPARK_HISTORY_OPTS=-Dspark.history.fs.logDirectory=file:///opt/spark/spark-events -Dspark.history.ui.port=18080
    depends_on:
      - spark-master

  postgres:
    container_name: airflow-postgres
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  airflow-webserver:
    container_name: airflow-webserver
    build:
      context: .
      dockerfile: Dockerfile
    image: custom-airflow-spark:latest
    depends_on:
      - postgres
      - spark-master
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__CORE__ENABLE_XCOM_PICKLING: "true"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
      AIRFLOW_CONN_SPARK_DEFAULT: "spark://spark-master:7077?deploy-mode=client&spark-binary=spark-submit"
      _PIP_ADDITIONAL_REQUIREMENTS: ""
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./data:/opt/spark/data
      - ./jobs:/opt/airflow/jobs
      - ./plugins:/opt/airflow/plugins
      - ./scripts:/opt/airflow/scripts
      - ./logs:/opt/airflow/logs
      - ./spark-events:/opt/spark/spark-events
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./valid_fips_codes.csv:/opt/airflow/valid_fips_codes.csv
    ports:
      - "8000:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always

  airflow-scheduler:
    container_name: airflow-scheduler
    image: custom-airflow-spark:latest
    depends_on:
      - postgres
      - airflow-webserver
      - spark-master
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__ENABLE_XCOM_PICKLING: "true"
      AIRFLOW_CONN_SPARK_DEFAULT: "spark://spark-master:7077"
      _PIP_ADDITIONAL_REQUIREMENTS: ""
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./data:/opt/spark/data
      - ./jobs:/opt/airflow/jobs
      - ./plugins:/opt/airflow/plugins
      - ./scripts:/opt/airflow/scripts
      - ./logs:/opt/airflow/logs
      - ./spark-events:/opt/spark/spark-events
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./valid_fips_codes.csv:/opt/airflow/valid_fips_codes.csv
    ports:
      - "4041:4040"
    command: scheduler
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"',
        ]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always

volumes:
  postgres-db-volume:
